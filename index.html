<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    font-family: 'Fira Sans', -apple-system, Segoe UI, sans-serif;
    background: #1e1e1e; color: #ccc;
    display: grid;
    grid-template-rows: 1fr auto;
    grid-template-areas:
      "workspace"
      "steps";
    overflow: hidden;
  }

  .workspace {
    grid-area: workspace;
    display: grid;
    grid-template-columns: var(--editor-width, 50%) 6px 1fr;
    min-height: 0;
    overflow: hidden;
  }

  .editor-pane {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    border-right: 1px solid #333;
  }
  .editor-toolbar {
    display: flex; gap: 6px; align-items: center;
    padding: 8px 12px;
    background: #252526;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .io-btn { padding: 6px 12px; background: #333; color: #ccc; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: inherit; transition: .15s; }
  .io-btn:hover { background: #3a3a3a; color: #fff; }
  .io-btn.primary { background: #0e639c; color: #fff; border-color: #1177bb; }
  .io-btn.primary:hover { background: #1177bb; }
  .io-btn.dirty { background: #b58900; color: #fff; border-color: #d4a017; }
  .io-btn.dirty:hover { background: #d4a017; }

  .editor-tabs {
    display: flex; background: #252526;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .tab {
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    color: #888; border-right: 1px solid #333;
  }
  .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #0e639c; padding-top: 6px; }

  .editor-area { flex: 1; position: relative; min-height: 0; }
  .editor-container { position: absolute; inset: 0; display: none; }
  .editor-container.active { display: block; }
  .CodeMirror {
    height: 100%;
    font-family: 'Fira Code', Consolas, Monaco, monospace;
    font-size: 15px; line-height: 1.55;
    background: #1e1e1e;
    font-variant-ligatures: contextual;
  }
  .CodeMirror-gutters { background: #252526; border-right: 1px solid #333; }

  .resize-handle {
    background: #333; cursor: col-resize; flex-shrink: 0;
    transition: background .15s;
  }
  .resize-handle:hover, .resize-handle.dragging { background: #0e639c; }

  .preview-pane {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;

  /* Плашка с title фрейма — всегда видна, фиксированной высоты */

    flex-shrink: 0;
    height: 28px;
    display: flex;

    padding: 0 12px;
    background: #000;
    color: #ccc;
    font-size: 12px;

  .preview-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .console-btn:hover { background: #333; color: #fff; }
  .console-body { flex: 1; overflow-y: auto; font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 13px; line-height: 1.5; }
  .console-panel.collapsed .console-body { display: none; }
  .console-line { padding: 4px 12px; border-bottom: 1px solid #252525; white-space: pre-wrap; word-break: break-word; display: flex; gap: 8px; }
  .console-line:last-child { border-bottom: none; }
  .console-line .console-icon { flex-shrink: 0; width: 14px; opacity: .8; }
  .console-line .console-msg { flex: 1; min-width: 0; }
  .console-line.log { color: #d4d4d4; }
  .console-line.info { color: #6cb6ff; }
  .console-line.warn { color: #e2b93b; background: rgba(226, 185, 59, .06); }
  .console-line.error { color: #f48771; background: rgba(244, 135, 113, .08); }
  .console-line.system { color: #888; font-style: italic; }
  .console-empty { padding: 12px; color: #555; font-style: italic; font-size: 12px; }

  .steps-panel {
    grid-area: steps;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: #252526;

  .steps-nav { display: flex; gap: 6px; align-items: center; }

  .step-nav:hover:not(:disabled) { background: #0e639c; color: #fff; border-color: #1177bb; }
  .step-nav:disabled { opacity: .35; cursor: not-allowed; }
  .step-counter { font-size: 13px; color: #999; min-width: 90px; text-align: center; }

  .step-name-input { padding: 6px 10px; background: #1e1e1e; color: #ddd; border: 1px solid #444; border-radius: 4px; font-size: 13px; width: 200px; font-family: inherit; }
  .step-delete, .step-add { padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: inherit; }

  .view-toggle {

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #0e639c; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; }

  @media (max-width: 768px) {
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .resize-handle { display: none; }

    body:not(.mobile-view-editor) .editor-pane { display: none; }
    body.mobile-view-editor .preview-pane { display: none; }

    .editor-pane, .preview-pane {
      grid-column: 1;
      grid-row: 1;
    }

    .view-toggle { display: flex; }

    .step-nav, .io-btn, .step-add, .step-delete { padding: 8px 14px; font-size: 14px; }
    .steps-panel { padding: 8px 12px; gap: 6px; }
    .editor-toolbar { padding: 8px 10px; }
    .toast { bottom: 90px; }
  }
</style>
</head>
<body>

<div class="workspace">
  <div class="editor-pane">
    <div class="editor-toolbar">
      <button type="button" class="io-btn primary" id="saveBtn" title="Сохранить в localStorage">💾 Сохранить</button>
      <button type="button" class="io-btn" id="exportBtn" title="Выгрузить в JSON">⬇ Экспорт</button>
      <button type="button" class="io-btn" id="importBtn" title="Импортировать из JSON">⬆ Импорт</button>

    <div class="editor-tabs" id="editorTabs">

    </div>

    <div class="editor-area">
      <div class="editor-container active" data-lang="html" id="editor-html"></div>

      <div class="editor-container" data-lang="js" id="editor-js"></div>
    </div>

    <div class="preview-body">

      <div class="console-panel collapsed" id="consolePanel">

          </div>
        </div>

</div>

<div class="steps-panel">
  <div class="view-toggle" id="viewToggle">
    <button type="button" data-view="editor">Редактор</button>
    <button type="button" data-view="preview" class="active">Превью</button>
  </div>

  <div class="steps-nav">
    <button type="button" class="step-nav" id="prevBtn" title="Предыдущий шаг (Alt+←)">←</button>
    <span class="step-counter" id="stepCounter"></span>
    <button type="button" class="step-nav" id="nextBtn" title="Следующий шаг (Alt+→)">→</button>
  </div>

  <input type="text" class="step-name-input" id="stepNameInput" placeholder="Имя шага">
  <button type="button" class="step-add" id="addStepBtn">+ Шаг</button>
  <button type="button" class="step-delete" id="deleteStepBtn">Удалить</button>

  <div class="steps-spacer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   МОДЕЛЬ
   ============================================================ */

const STORAGE_KEY = 'step-editor:v1';
const SPLIT_KEY = 'step-editor:split';

const HTML5_BOILERPLATE = `<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Документ</title>
</head>
<body>
  
</body>
</html>`;
const CSS_BOILERPLATE = `/* Стили */`;
const JS_BOILERPLATE = `// JavaScript`;

function makeEmptyStep(index) {
  return { name: 'Шаг ' + index, html: HTML5_BOILERPLATE, css: CSS_BOILERPLATE, js: JS_BOILERPLATE };
}
function makeDefaultSteps() { return [makeEmptyStep(1)]; }

let steps = makeDefaultSteps();
let currentStep = 0;
let currentLang = 'html';
let debounceTimer;
let savedSnapshot = '';

/* ---------- DOM ---------- */
const previewFrame = document.getElementById('previewFrame');
const previewTitle = document.getElementById('previewTitle');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const stepCounter = document.getElementById('stepCounter');
const stepNameInput = document.getElementById('stepNameInput');
const addStepBtn = document.getElementById('addStepBtn');
const deleteStepBtn = document.getElementById('deleteStepBtn');
const saveBtn = document.getElementById('saveBtn');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
const toastEl = document.getElementById('toast');
const viewToggle = document.getElementById('viewToggle');

const consolePanel = document.getElementById('consolePanel');
const consoleHeader = document.getElementById('consoleHeader');
const consoleBody = document.getElementById('consoleBody');
const consoleCount = document.getElementById('consoleCount');
const consoleClearBtn = document.getElementById('consoleClearBtn');

const editorPane = document.querySelector('.editor-pane');
const editorTabs = document.querySelectorAll('#editorTabs .tab');
const editorContainers = document.querySelectorAll('.editor-container');

/* ---------- Утилиты ---------- */
function showToast(msg, kind = 'info') {
  toastEl.textContent = msg;
  toastEl.style.background = kind === 'error' ? '#c0392b' : kind === 'success' ? '#27ae60' : '#0e639c';
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function snapshot() { return JSON.stringify(steps); }

function markDirty() {
  const dirty = snapshot() !== savedSnapshot;
  saveBtn.classList.toggle('dirty', dirty);
  saveBtn.textContent = dirty ? '💾 Сохранить*' : '💾 Сохранить';
}

/* ============================================================
   КОНСОЛЬ
   ============================================================ */

const consoleState = { messages: [], errorCount: 0 };
const ICONS = { log: '›', info: 'ℹ', warn: '⚠', error: '✖', system: '•' };

function formatValue(v) {
  if (v === null) return 'null';
  if (v === undefined) return 'undefined';
  if (typeof v === 'string') return v;
  if (typeof v === 'number' || typeof v === 'boolean' || typeof v === 'bigint') return String(v);
  if (typeof v === 'function') return v.toString().split('\n')[0];
  if (v instanceof Error) return v.stack || (v.name + ': ' + v.message);
  if (v instanceof Element) return '<' + v.tagName.toLowerCase() + (v.id ? '#' + v.id : '') + '>';
  try {
    const seen = new WeakSet();
    return JSON.stringify(v, (k, val) => {
      if (typeof val === 'object' && val !== null) {
        if (seen.has(val)) return '[Circular]';
        seen.add(val);
      }
      return val;
    }, 2);
  } catch { return String(v); }
}

function formatArgs(args) { return args.map(a => typeof a === 'string' ? a : formatValue(a)).join(' '); }

function appendConsoleLine(level, text) {
  const empty = consoleBody.querySelector('.console-empty');
  if (empty) empty.remove();

  const line = document.createElement('div');
  line.className = 'console-line ' + level;

  const icon = document.createElement('span');
  icon.className = 'console-icon';
  icon.textContent = ICONS[level] || '›';

  const msg = document.createElement('span');
  msg.className = 'console-msg';
  msg.textContent = text;

  line.appendChild(icon);
  line.appendChild(msg);
  consoleBody.appendChild(line);
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

function pushConsole(level, args) {
  const text = Array.isArray(args) ? formatArgs(args) : String(args);
  consoleState.messages.push({ level, text });
  if (level === 'error') consoleState.errorCount++;
  consoleCount.textContent = consoleState.messages.length;
  consoleCount.classList.toggle('has-errors', consoleState.errorCount > 0);
  appendConsoleLine(level, text);
}

function clearConsole() {
  consoleState.messages = [];
  consoleState.errorCount = 0;
  consoleBody.innerHTML = '<div class="console-empty">Консоль пуста</div>';
  consoleCount.textContent = '0';
  consoleCount.classList.remove('has-errors');
}

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.__stepEditorConsole !== true) return;
  if (event.source !== previewFrame.contentWindow) return;
  if (data.type === 'log') pushConsole(data.level, data.args);
  else if (data.type === 'clear') clearConsole();
});

function buildConsoleInterceptor() {
  return `<script>
(function(){
  var send = function(level, args) {
    try {
      var safe = [];
      for (var i = 0; i < args.length; i++) {
        var a = args[i];
        if (typeof a === 'string' || typeof a === 'number' || typeof a === 'boolean' || a === null || a === undefined) {
          safe.push(a);
        } else {
          try {
            if (a instanceof Error) safe.push(a.stack || (a.name + ': ' + a.message));
            else if (a instanceof Element) safe.push('<' + a.tagName.toLowerCase() + (a.id ? '#' + a.id : '') + '>');
            else {
              var seen = new WeakSet();
              safe.push(JSON.stringify(a, function(k, v) {
                if (typeof v === 'object' && v !== null) {
                  if (seen.has(v)) return '[Circular]';
                  seen.add(v);
                }
                return v;
              }));
            }
          } catch (e) { safe.push(String(a)); }
        }
      }
      parent.postMessage({ __stepEditorConsole: true, type: 'log', level: level, args: safe }, '*');
    } catch (e) {}
  };
  ['log','info','warn','error','debug'].forEach(function(level) {
    console[level] = function() {
      send(level === 'debug' ? 'log' : level, Array.prototype.slice.call(arguments));
    };
  });
  window.addEventListener('error', function(e) {
    send('error', [e.message + (e.filename ? ' (' + e.filename + ':' + e.lineno + ':' + e.colno + ')' : '')]);
  });
  window.addEventListener('unhandledrejection', function(e) {
    var r = e.reason;
    send('error', ['Unhandled rejection: ' + (r && r.message ? r.message : String(r))]);
  });
  send('system', ['— новый запуск —']);
})();
<\/script>`;
}

function buildPreviewDoc(step) {
  const interceptor = buildConsoleInterceptor();
  const userHtml = step.html || '';
  const userCss = step.css || '';
  const userJs = step.js || '';
  const isFullDoc = /<!DOCTYPE html>|<html[\s>]/i.test(userHtml);

  if (isFullDoc) {
    let doc = userHtml;
    if (/<head[^>]*>/i.test(doc)) doc = doc.replace(/<head[^>]*>/i, (m) => m + '\n' + interceptor);
    else if (/<html[^>]*>/i.test(doc)) doc = doc.replace(/<html[^>]*>/i, (m) => m + '\n<head>' + interceptor + '</head>');
    else doc = interceptor + doc;

    if (userCss.trim()) {
      if (/<\/head>/i.test(doc)) doc = doc.replace(/<\/head>/i, `<style>${userCss}</style>\n</head>`);
      else doc = `<style>${userCss}</style>\n` + doc;
    }
    if (userJs.trim()) {
      const jsBlock = `<script>\ntry {\n${userJs}\n} catch (e) { console.error(e); }\n<\/script>`;
      if (/<\/body>/i.test(doc)) doc = doc.replace(/<\/body>/i, jsBlock + '\n</body>');
      else doc = doc + '\n' + jsBlock;
    }
    return doc;
  }

  return `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">${interceptor}<style>${userCss}</style></head><body>${userHtml}<script>try {\n${userJs}\n} catch (e) { console.error(e); }<\/script></body></html>`;
}

function updatePreview() {
  clearConsole();
  const doc = buildPreviewDoc(steps[currentStep]);
  previewFrame.srcdoc = doc;

  // Извлекаем <title> из собранного документа
  const match = doc.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  const titleText = match ? match[1].trim() : '';

  if (titleText) {
    previewTitle.textContent = titleText;
    previewTitle.classList.remove('untitled');
  } else {
    previewTitle.textContent = 'Untitled page';
    previewTitle.classList.add('untitled');
  }
}

/* ============================================================
   РЕДАКТОРЫ
   ============================================================ */

const editors = {};

function initEditors() {
  const configs = {
    html: { mode: 'htmlmixed', theme: 'monokai', autoCloseTags: true, autoCloseBrackets: true },
    css:  { mode: 'css',       theme: 'monokai', autoCloseBrackets: true },
    js:   { mode: 'javascript',theme: 'monokai', autoCloseBrackets: true }
  };

  Object.keys(configs).forEach(lang => {
    const container = document.getElementById(`editor-${lang}`);
    editors[lang] = CodeMirror(container, {
      ...configs[lang],
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 2,
      tabSize: 2,
      indentWithTabs: false,
      extraKeys: { "Tab": (cm) => { cm.replaceSelection("  "); } }
    });

    editors[lang].on('change', () => {
      saveEditorToStep();
      markDirty();
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updatePreview, 300);
    });
  });
}

function loadStepIntoEditors() {
  const step = steps[currentStep];
  Object.keys(editors).forEach(lang => editors[lang].setValue(step[lang] || ''));
  stepNameInput.value = step.name;
}

function saveEditorToStep() {
  const step = steps[currentStep];
  Object.keys(editors).forEach(lang => { step[lang] = editors[lang].getValue(); });
}

/* ============================================================
   ШАГИ
   ============================================================ */

function renderSteps() {
  stepCounter.textContent = `Шаг ${currentStep + 1} из ${steps.length}`;
  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = currentStep === steps.length - 1;
  deleteStepBtn.disabled = steps.length <= 1;
  deleteStepBtn.style.opacity = steps.length <= 1 ? 0.35 : 1;
  deleteStepBtn.style.cursor = steps.length <= 1 ? 'not-allowed' : 'pointer';
}

function switchStep(index) {
  if (index < 0 || index >= steps.length) return;
  currentStep = index;
  loadStepIntoEditors();
  renderSteps();
  updatePreview();
}

prevBtn.onclick = () => switchStep(currentStep - 1);
nextBtn.onclick = () => switchStep(currentStep + 1);

addStepBtn.onclick = () => {
  const cur = steps[currentStep];
  steps.push({ name: 'Шаг ' + (steps.length + 1), html: cur.html, css: cur.css, js: cur.js });
  markDirty();
  switchStep(steps.length - 1);
};

deleteStepBtn.onclick = () => {
  if (steps.length <= 1) return;
  steps.splice(currentStep, 1);
  if (currentStep >= steps.length) currentStep = steps.length - 1;
  markDirty();
  switchStep(currentStep);
};

stepNameInput.oninput = (e) => {
  steps[currentStep].name = e.target.value;
  markDirty();
};

/* ============================================================
   ВКЛАДКИ
   ============================================================ */

editorTabs.forEach(tab => {
  tab.onclick = () => {
    editorTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentLang = tab.dataset.lang;
    editorContainers.forEach(c => c.classList.toggle('active', c.dataset.lang === currentLang));
    if (editors[currentLang]) setTimeout(() => editors[currentLang].refresh(), 10);
  };
});

/* ============================================================
   МОБИЛЬНЫЙ ПЕРЕКЛЮЧАТЕЛЬ
   ============================================================ */

function setMobileView(view) {
  document.body.classList.toggle('mobile-view-editor', view === 'editor');
  document.body.classList.toggle('mobile-view-preview', view === 'preview');
  viewToggle.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  setTimeout(() => {
    Object.values(editors).forEach(ed => ed.refresh());
  }, 30);
}

viewToggle.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => setMobileView(btn.dataset.view);
});

if (window.matchMedia('(max-width: 768px)').matches) {
  setMobileView('preview');
}

/* ============================================================
   КОНСОЛЬ: сворачивание
   ============================================================ */

consoleHeader.addEventListener('click', (e) => {
  if (e.target.closest('.console-actions')) return;
  consolePanel.classList.toggle('collapsed');
});
consoleClearBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  clearConsole();
});

/* ============================================================
   RESIZE HANDLE
   ============================================================ */

(function() {
  const handle = document.getElementById('resizeHandle');
  const workspace = document.querySelector('.workspace');
  let dragging = false;
  const MIN_PX = 200;

  function setLeftWidth(pct, persist = false) {
    pct = Math.max(0, Math.min(100, pct));
    document.documentElement.style.setProperty('--editor-width', pct + '%');
    Object.values(editors).forEach(ed => ed.refresh());
    if (persist) {
      try { localStorage.setItem(SPLIT_KEY, String(pct)); } catch (e) {}
    }
  }

  (function restore() {
    try {
      const raw = localStorage.getItem(SPLIT_KEY);
      if (raw === null) return;
      const pct = parseFloat(raw);
      if (isFinite(pct)) setLeftWidth(pct);
    } catch (e) {}
  })();

  function onMouseDown(e) {
    e.preventDefault();
    dragging = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    handle.classList.add('dragging');
    previewFrame.style.pointerEvents = 'none';
    consolePanel.style.pointerEvents = 'none';
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  }

  function onMouseMove(e) {
    if (!dragging) return;
    const rect = workspace.getBoundingClientRect();
    const minPct = (MIN_PX / rect.width) * 100;
    const maxPct = 100 - minPct;
    let pct = ((e.clientX - rect.left) / rect.width) * 100;
    pct = Math.max(minPct, Math.min(maxPct, pct));
    setLeftWidth(pct);
  }

  function onMouseUp() {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    handle.classList.remove('dragging');
    previewFrame.style.pointerEvents = '';
    consolePanel.style.pointerEvents = '';
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);

    const cur = getComputedStyle(document.documentElement).getPropertyValue('--editor-width');
    const pct = parseFloat(cur);
    if (isFinite(pct)) {
      try { localStorage.setItem(SPLIT_KEY, String(pct)); } catch (e) {}
    }
  }

  handle.addEventListener('mousedown', onMouseDown);
  handle.addEventListener('dblclick', () => setLeftWidth(50, true));
  window.addEventListener('blur', onMouseUp);
})();

/* ============================================================
   СОХРАНЕНИЕ / ЭКСПОРТ / ИМПОРТ
   ============================================================ */

function saveToStorage() {
  saveEditorToStep();
  try {
    localStorage.setItem(STORAGE_KEY, snapshot());
    savedSnapshot = snapshot();
    markDirty();
    showToast('Сохранено в localStorage', 'success');
  } catch (e) {
    showToast('Не удалось сохранить: ' + e.message, 'error');
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0) return null;
    return parsed.map((s, i) => ({
      name: typeof s.name === 'string' ? s.name : 'Шаг ' + (i + 1),
      html: typeof s.html === 'string' ? s.html : '',
      css:  typeof s.css  === 'string' ? s.css  : '',
      js:   typeof s.js   === 'string' ? s.js   : ''
    }));
  } catch { return null; }
}

function exportJSON() {
  try {
    saveEditorToStep();
    const data = JSON.stringify(steps, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const stamp = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0') + '-' +
      String(now.getDate()).padStart(2, '0') + '_' +
      String(now.getHours()).padStart(2, '0') + '-' +
      String(now.getMinutes()).padStart(2, '0');
    const a = document.createElement('a');
    a.href = url;
    a.download = `steps-${stamp}.json`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
    showToast('JSON выгружен', 'success');
  } catch (e) {
    showToast('Ошибка экспорта: ' + e.message, 'error');
  }
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('Ожидается непустой массив шагов');
      const normalized = parsed.map((s, i) => ({
        name: typeof s.name === 'string' ? s.name : 'Шаг ' + (i + 1),
        html: typeof s.html === 'string' ? s.html : '',
        css:  typeof s.css  === 'string' ? s.css  : '',
        js:   typeof s.js   === 'string' ? s.js   : ''
      }));
      steps = normalized;
      currentStep = 0;
      loadStepIntoEditors();
      renderSteps();
      updatePreview();
      markDirty();
      showToast('Импортировано шагов: ' + normalized.length, 'success');
    } catch (e) {
      showToast('Ошибка импорта: ' + e.message, 'error');
    }
  };
  reader.onerror = () => showToast('Не удалось прочитать файл', 'error');
  reader.readAsText(file);
}

saveBtn.onclick = saveToStorage;
exportBtn.onclick = exportJSON;
importBtn.onclick = () => importFile.click();
importFile.onchange = (e) => {
  const file = e.target.files[0];
  if (file) importJSON(file);
  importFile.value = '';
};

/* ============================================================
   ГОРЯЧИЕ КЛАВИШИ
   ============================================================ */

document.addEventListener('keydown', (e) => {
  if (e.altKey && e.key === 'ArrowRight') { switchStep(currentStep + 1); e.preventDefault(); }
  if (e.altKey && e.key === 'ArrowLeft')  { switchStep(currentStep - 1); e.preventDefault(); }
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

initEditors();

const loaded = loadFromStorage();
if (loaded) {
  steps = loaded;
  currentStep = 0;
  savedSnapshot = snapshot();
} else {
  steps = makeDefaultSteps();
  currentStep = 0;
  savedSnapshot = snapshot();
}

loadStepIntoEditors();
renderSteps();
updatePreview();
markDirty();
</script>
</body>
</html>
